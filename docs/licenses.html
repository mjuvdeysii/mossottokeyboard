<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=notices.html">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第三方致谢与许可 · Mosto键盘</title>
<style>:root{
  --bg:#F7F4EE;
  --surface:#FFFFFF;
  --surface-muted:#EFEAE0;
  --ink:#1E192B;
  --sub:#6A6478;
  --line:#E4DDD0;
  --violet:#633EBF;
  --on-violet:#FFFFFF;
  --amber:#D69A34;
  --moss:#55704A;
  --otto:#203872;
  --shadow:0 12px 32px rgba(30,25,43,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14121D;
    --surface:#1F1B2E;
    --surface-muted:#28233B;
    --ink:#F4F1FA;
    --sub:#A7A1B8;
    --line:rgba(255,255,255,.11);
    --violet:#A78BFA;
    --on-violet:#1A1429;
    --amber:#FFC45A;
    --moss:#7EA86E;
    --otto:#7FA6E8;
    --shadow:0 14px 36px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--violet);text-decoration:none}
a:hover{text-decoration:underline}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1040px;
  margin:0 auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  color:var(--ink);
  letter-spacing:-.01em;
}
.brand-dot{
  width:10px;
  height:10px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--violet),var(--amber));
  box-shadow:0 0 12px color-mix(in srgb,var(--amber) 55%,transparent);
}
nav{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  font-size:14px;
  font-weight:500;
}
nav a{color:var(--sub)}
nav a:hover,nav a[aria-current="page"]{color:var(--ink);text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 64px}
.narrow{max-width:780px}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px 24px;
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px 20px;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  transition:transform .15s ease,opacity .15s ease;
}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--violet);color:var(--on-violet)}
.btn-secondary{background:var(--surface-muted);color:var(--ink);border:1px solid var(--line)}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  background:color-mix(in srgb,var(--violet) 12%,transparent);
  color:var(--violet);
}
.pill-moss{background:color-mix(in srgb,var(--moss) 14%,transparent);color:var(--moss)}
.pill-amber{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
footer{
  margin-top:48px;
  padding-top:24px;
  border-top:1px solid var(--line);
  color:var(--sub);
  font-size:13px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.footer-links{display:flex;gap:16px;flex-wrap:wrap}
.footer-links a{color:var(--sub)}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html"><span class="brand-dot"></span><span>Mosto键盘</span></a><nav><a href="index.html">首页</a><a href="index.html#features">核心能力</a><a href="index.html#family">摸索台灯</a><a href="index.html#support">官方支持</a><a href="privacy.html">隐私政策</a><a href="terms.html">用户协议</a><a href="notices.html" aria-current="page">致谢与合规</a></nav></div></header>
<main class="wrap narrow">
  <section class="card">
    <h1 style="margin:0 0 8px">第三方致谢与许可</h1>
    <p style="color:var(--sub)">相关内容已合并收录于新版《第三方致谢与合规声明》页面。</p>
    <p style="margin-top:18px"><a class="btn btn-primary" href="notices.html">前往第三方致谢与合规声明</a></p>
  </section>
  <footer><div>Mosto键盘 · 独立开发 · 纯离线零追踪 · © 2026 Mosto Works</div><div class="footer-links"><a href="privacy.html">隐私政策</a><a href="terms.html">用户协议</a><a href="notices.html">第三方致谢与合规声明</a><a href="index.html#support">官方支持</a></div></footer>
</main>
</body>
</html>
